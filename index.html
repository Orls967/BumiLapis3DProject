<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BumiLapis — jelajahi lapisan Bumi dari eksosfer sampai inti dalam, lengkap dengan stratigrafi dan sedimentologi." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BumiLapis — Jelajah Lapisan Bumi</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bl-theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
